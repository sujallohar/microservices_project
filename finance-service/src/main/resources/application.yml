server:
  port: 4000

spring:
  application:
    name: finance-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:govasset_finance}
    username: ${POSTGRES_USER:finance_user}
    password: ${POSTGRES_PASSWORD:finance_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# RabbitMQ Topology Config
govasset:
  rabbitmq:
    exchange: govasset.topic.exchange
    outbox:
      routing-key: finance.procurement.approved
    compensation-queue: queue.finance.compensations
    compensation-routing-key: saga.compensate.procurement

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      identityVerificationBreaker:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000ms
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 5

# Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
