apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-db
  namespace: govasset
spec:
  serviceName: mongo-db
  replicas: 1
  selector:
    matchLabels:
      app: mongo-db
  template:
    metadata:
      labels:
        app: mongo-db
    spec:
      containers:
        - name: mongo
          image: mongo:7.0
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "registry_admin"
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: govasset-secrets
                  key: MONGO_PASSWORD
            - name: MONGO_INITDB_DATABASE
              value: "govasset_registry"
          ports:
            - containerPort: 27017
              name: mongo
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: mongo-db
  namespace: govasset
spec:
  ports:
    - port: 27017
      name: mongo
  selector:
    app: mongo-db
