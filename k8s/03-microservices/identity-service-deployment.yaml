apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: govasset
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
        - name: identity-service
          image: govasset/identity-service:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: govasset-config
            - secretRef:
                name: govasset-secrets
          ports:
            - containerPort: 4001
              name: http
            - containerPort: 9091
              name: grpc
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 4001
            initialDelaySeconds: 25
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 4001
            initialDelaySeconds: 15
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: govasset
spec:
  ports:
    - port: 4001
      targetPort: 4001
      name: http
    - port: 9091
      targetPort: 9091
      name: grpc
  selector:
    app: identity-service
