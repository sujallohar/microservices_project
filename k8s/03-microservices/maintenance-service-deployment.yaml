apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenance-service
  namespace: govasset
spec:
  replicas: 2
  selector:
    matchLabels:
      app: maintenance-service
  template:
    metadata:
      labels:
        app: maintenance-service
    spec:
      containers:
        - name: maintenance-service
          image: govasset/maintenance-service:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: govasset-config
            - secretRef:
                name: govasset-secrets
          ports:
            - containerPort: 4003
              name: http
          livenessProbe:
            httpGet:
              path: /api/v1/maintenance/health
              port: 4003
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/maintenance/health
              port: 4003
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: maintenance-service
  namespace: govasset
spec:
  ports:
    - port: 4003
      targetPort: 4003
      name: http
  selector:
    app: maintenance-service
