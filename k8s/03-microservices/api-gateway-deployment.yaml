apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: govasset
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: govasset/api-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_HOST
              value: "redis-db.govasset.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: IDENTITY_SERVICE_URI
              value: "http://identity-service.govasset.svc.cluster.local:4001"
            - name: FINANCE_SERVICE_URI
              value: "http://finance-service.govasset.svc.cluster.local:4000"
            - name: ASSET_SERVICE_URI
              value: "http://asset-registry.govasset.svc.cluster.local:4002"
            - name: MAINTENANCE_SERVICE_URI
              value: "http://maintenance-service.govasset.svc.cluster.local:4003"
          envFrom:
            - secretRef:
                name: govasset-secrets
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: govasset
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8080
      name: http
  selector:
    app: api-gateway
