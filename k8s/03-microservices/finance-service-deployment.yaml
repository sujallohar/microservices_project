apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-service
  namespace: govasset
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finance-service
  template:
    metadata:
      labels:
        app: finance-service
    spec:
      containers:
        - name: finance-service
          image: govasset/finance-service:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: govasset-config
            - secretRef:
                name: govasset-secrets
          ports:
            - containerPort: 4000
              name: http
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 4000
            initialDelaySeconds: 25
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: finance-service
  namespace: govasset
spec:
  ports:
    - port: 4000
      targetPort: 4000
      name: http
  selector:
    app: finance-service
