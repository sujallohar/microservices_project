apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default-strict-mtls
  namespace: govasset
spec:
  mtls:
    mode: STRICT # Enforces Mutual TLS on all pod-to-pod internal communication

---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-internal-mesh
  namespace: govasset
spec:
  selector:
    matchLabels:
      app: finance-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/govasset/sa/api-gateway", "cluster.local/ns/govasset/sa/maintenance-service"]
