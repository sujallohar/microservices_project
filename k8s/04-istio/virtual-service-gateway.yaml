apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: govasset-ingress-gateway
  namespace: govasset
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "govasset.gujarat.gov.in"
        - "*"

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: govasset-virtual-service
  namespace: govasset
spec:
  hosts:
    - "govasset.gujarat.gov.in"
    - "*"
  gateways:
    - govasset-ingress-gateway
  http:
    - match:
        - uri:
            prefix: /api/v1/
      route:
        - destination:
            host: api-gateway.govasset.svc.cluster.local
            port:
              number: 80
