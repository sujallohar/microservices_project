apiVersion: v1
kind: Secret
metadata:
  name: govasset-secrets
  namespace: govasset
type: Opaque
stringData:
  REDIS_PASSWORD: "redis_password"
  POSTGRES_PASSWORD: "finance_password"
  MONGO_PASSWORD: "registry_password"
  MYSQL_PASSWORD: "maintenance_password"
  MYSQL_ROOT_PASSWORD: "root_password"
  RABBITMQ_PASSWORD: "govasset_secret"
  JWT_SECRET: "GovAssetSecretKey2026DistributedCloudNativeSuperSecureTokenKeyLongEnoughForHMACSHA256"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: govasset-config
  namespace: govasset
data:
  REDIS_HOST: "redis-db.govasset.svc.cluster.local"
  REDIS_PORT: "6379"
  POSTGRES_HOST: "postgres-db.govasset.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "govasset_finance"
  POSTGRES_USER: "finance_user"
  MONGO_URI: "mongodb://registry_admin:registry_password@mongo-db.govasset.svc.cluster.local:27017/govasset_registry?authSource=admin"
  MYSQL_HOST: "mysql-db.govasset.svc.cluster.local"
  MYSQL_PORT: "3306"
  MYSQL_DB: "govasset_maintenance"
  MYSQL_USER: "maintenance_user"
  RABBITMQ_HOST: "rabbitmq.govasset.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: "govasset"
  RABBITMQ_EXCHANGE: "govasset.topic.exchange"
  ASSET_GRPC_HOST: "asset-registry.govasset.svc.cluster.local"
  ASSET_GRPC_PORT: "9092"
