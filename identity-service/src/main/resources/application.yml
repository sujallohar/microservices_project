server:
  port: 4001

spring:
  application:
    name: identity-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_password}
      timeout: 2000ms

# gRPC Server Settings
grpc:
  server:
    port: ${GRPC_PORT:9091}

# JWT Secret Configuration
jwt:
  secret: ${JWT_SECRET:GovAssetSecretKey2026DistributedCloudNativeSuperSecureTokenKeyLongEnoughForHMACSHA256}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

# Observability & Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Eureka Discovery Client Configuration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    register-with-eureka: ${ENABLE_EUREKA:false}
    fetch-registry: ${ENABLE_EUREKA:false}
  instance:
    prefer-ip-address: true
